  if(tot <= 1e-9){ pesos = els.map(e => e.partidas.find(x => x.item === p.item).metrado); tot = pesos.reduce((a,b) => a+b, 0); }
  const regs = els.map((e,i) => ({id:e.id, item:p.item, cantidad:+(Q*pesos[i]/tot).toFixed(6)})).filter(r => r.cantidad);
  const ok = await dialogo(`<h2>¿Está seguro de colocar por la partida completa?</h2><p>Se registrarán <b>${nf(Q,3)} ${esc(p.und)}</b> de <b>${esc(p.item)} ${esc(p.desc)}</b> con fecha ${esc($("#fecha").value.split("-").reverse().join("/"))}, repartidos entre <b>${regs.length}</b> elementos según su saldo${$("#nivel").value ? " (solo los del nivel visible)" : ""}.</p><p class="nota">Se escribe en Revit (parámetros VZ_) y se suma a lo ya ejecutado.</p>`,
    [["Cancelar", false], ["Sí, registrar", true, "pri"]]);
  if(ok) registrar(regs);
}

async function registrar(registros){
  const fecha = $("#fecha").value; if(!fecha) return toast("Elige la fecha del parte.");
  registros = registros.filter(r => r.cantidad && !isNaN(r.cantidad)); if(!registros.length) return toast("Cantidad no válida.");
  try{
    const r = await api("/api/metrado", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({fecha, simular:false, registros})});
    r.elementos.forEach(x => { const e = S.porId[x.id]; if(e){ e.registro = x.registro; e.obs = x.obs; e.regs = parsear(x.registro); e.ejec = sumar(e.regs); } });
    S.globalRegs = parsear(r.registroGlobal); S.global = sumar(S.globalRegs);
    pintarLista(); pintarDetalle(); pintarValorizacion(); pintarParte(); V.colorear();
    if(r.alertas.length) alert("ALERTA DE MAYOR METRADO\n\n" + r.alertas.join("\n") + "\n\nQuedó anotado en VZ_Observaciones del elemento.");
    if(r.rechazados.length) alert("No se registraron:\n" + r.rechazados.map(x => `${x.id||"Partida"} ${x.item}: ${x.motivo}`).join("\n"));
    toast(`Registrado en Revit: ${r.aplicados.length} valores` + (r.notas.length ? " · " + r.notas.length + " parámetros creados" : ""));
  }catch(err){ alert("No se pudo registrar en Revit:\n" + err.message); }
}

/* ============================================================ valorización mensual */
function periodos(){ const ini = S.datos.inicio; const fechas = [ini, hoy()]; S.els.forEach(e => e.regs.forEach(r => fechas.push(r.f))); S.globalRegs.forEach(r => fechas.push(r.f));
  const max = fechas.sort().at(-1); const out = []; let y = +ini.slice(0,4), m = +ini.slice(5,7), n = 1;
  while(true){ const d = `${y}-${String(m).padStart(2,"0")}`; out.push({n, desde:d+"-01", hasta:d+"-"+String(new Date(y,m,0).getDate()).padStart(2,"0"), etq:new Date(y,m-1,1).toLocaleDateString("es-PE",{month:"long",year:"numeric"})});
    if(d >= max.slice(0,7)) break; n++; m++; if(m > 12){ m = 1; y++; } }
  return out; }
function pintarValorizacion(){
  if(!S.datos) return;
  const per = periodos(), sel = $("#mes"), v = sel.value;
  sel.innerHTML = per.map(p => `<option value="${p.n}">N° ${String(p.n).padStart(2,"0")} · ${p.etq}</option>`).join("");
  sel.value = v && per.some(p => p.n == v) ? v : String(per.find(p => p.desde <= hoy() && hoy() <= p.hasta)?.n || per.at(-1).n);
  const p = per.find(x => x.n == sel.value);
  const ant = {}, act = {};
  const sumarA = (regs) => regs.forEach(r => { if(r.f < p.desde) ant[r.it] = (ant[r.it]||0) + r.q; else if(r.f <= p.hasta) act[r.it] = (act[r.it]||0) + r.q; });
  S.els.forEach(e => sumarA(e.regs)); sumarA(S.globalRegs);
  let tA = 0, tM = 0, tAc = 0, tP = 0, filas = "";
  S.partidas.forEach(x => { const a = ant[x.item]||0, m = act[x.item]||0, ac = a + m; tP += x.metrado*x.pu; tA += a*x.pu; tM += m*x.pu; tAc += ac*x.pu;

  const pie = S.datos.pie, gg = pie.gg||0, ut = pie.ut||0, igv = pie.igv||0, sub = tM*(1+gg+ut);

    <div class="kpis"><div class="kpi"><small>Del mes (CD)</small><b>${nf(tM)}</b></div><div class="kpi"><small>Acumulado (CD)</small><b>${nf(tAc)}</b><small>${nf(tP?tAc/tP*100:0,1)}% del presupuesto</small></div><div class="kpi"><small>Del mes con GG, UT e IGV</small><b>${nf(sub*(1+igv))}</b></div></div>
    <div class="nota">Costo directo ${nf(tM)} + gastos generales ${nf(gg*100,0)}% + utilidad ${nf(ut*100,0)}% = ${nf(sub)} · IGV ${nf(igv*100,0)}% = ${nf(sub*igv)}</div></div>` +
    (filas ? `<table><thead><tr><th>Ítem</th><th>Descripción</th><th>Und</th><th class="n">Contrato</th><th class="n">Anterior</th><th class="n">Del mes</th><th class="n">Acumulado</th><th class="n">Saldo</th><th class="n">%</th><th class="n">Monto mes</th></tr></thead><tbody>${filas}</tbody></table>`
           : '<div class="vacio">No hay metrados registrados hasta este periodo.</div>');

/* ============================================================ cronograma (Gantt) programado */
function nombrePaquete(id){ return CRONO?.paquetes[id] || ({AN1:"Anillo 1 · muros anclados del semisótano", AN2:"Anillo 2 · muros anclados del sótano 1", "":"Generales y movimiento de tierras"}[id] ?? id); }
const COL_TIPO = t => ["EXC","ANC","TEN","MUA","MAN","FPI"].includes(t) ? "#A0522D" : ["CIM","AV","EV","CV","ALB"].includes(t) ? "#2563EB" : ["EH","AH","CH"].includes(t) ? "#D4A14A" : "#7c8698";
function pintarGantt(){
  if(!CRONO){ $("#gantt").innerHTML = '<div class="vacio">El panel no tiene el cronograma incrustado: corre armar_panel.py.</div>'; return; }
  const acts = CRONO.actividades, ini = CRONO.inicio, fin = DIAS_OBRA.at(-1);
  const d0 = dISO(ini); d0.setDate(d0.getDate() - ((d0.getDay()+6)%7));               // lunes de la primera semana
  const semanas = []; for(let d = new Date(d0); isoD(d) <= fin; d.setDate(d.getDate()+7)) semanas.push(isoD(d));
  const PX = 14, ancho = semanas.length * 7 * PX, dx = s => Math.round((dISO(s) - d0) / 864e5) * PX;
  const hoyX = dx(hoy()), grupos = [];
  acts.forEach(a => { const k = a.paquete || ""; let g = grupos.find(x => x.k === k); if(!g) grupos.push(g = {k, acts:[]}); g.acts.push(a); });
  let h = `<table><thead><tr><th class="fijo">Actividad</th><th>Inicio</th><th>Fin</th><th class="n">Días</th><th class="n">Monto CD</th><th style="padding:0"><div style="position:relative;width:${ancho}px;height:22px">` +
    semanas.map((s,i) => `<span style="position:absolute;left:${i*7*PX}px;top:4px;font-weight:400;font-size:10px;color:var(--mut)">${fmtD(s).slice(0,5)}</span>`).join("") + `</div></th></tr></thead><tbody>`;
  grupos.forEach(g => { h += `<tr class="grp"><td class="fijo" colspan="5">${esc(nombrePaquete(g.k))}</td><td></td></tr>`;
    g.acts.forEach(a => { h += `<tr class="act ${S.selAct===a.id?"on":""}" data-act="${a.id}"><td class="fijo" title="${esc(a.id)}">${esc(a.nombre)}</td><td>${fmtD(a.inicio)}</td><td>${fmtD(a.fin)}</td><td class="n">${a.duracion}</td><td class="n">${nf(a.monto_cd,0)}</td>
      <td class="g"><div style="position:relative;width:${ancho}px;height:21px">${hoyX>=0&&hoyX<=ancho?`<i style="position:absolute;left:${hoyX}px;top:0;bottom:0;width:1px;background:#DC2626"></i>`:""}<div class="gb" style="left:${dx(a.inicio)}px;width:${Math.max(PX, dx(a.fin)-dx(a.inicio)+PX)}px;background:${COL_TIPO(a.tipo)}" title="${esc(a.nombre)} · ${fmtD(a.inicio)} → ${fmtD(a.fin)}"></div></div></td></tr>`; }); });
  h += `</tbody></table><div class="nota pad">Programado del cronograma (calendario lunes a sábado, sin feriados). Clic en una actividad para ver sus elementos en el 3D. Línea roja = hoy.</div>`;
  $("#gantt").innerHTML = h;
  $("#gantt").querySelectorAll("tr.act").forEach(tr => tr.onclick = () => { S.selAct = S.selAct === tr.dataset.act ? null : tr.dataset.act; S.selPartida = null; S.selEl = null;
    $("#gantt").querySelectorAll("tr.act").forEach(x => x.classList.toggle("on", x.dataset.act === S.selAct)); pintarLista(); pintarDetalle(); V.colorear(); });
}

/* ============================================================ formato de valorización (imprimible) */
const LS = "nexoNO_formato";
function leerLS(){ try{ return JSON.parse(localStorage.getItem(LS)) || {}; }catch(e){ return {}; } }
function guardarLS(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }
function abrirFormato(){ const c = leerLS(); $("#fAdel").value = c.adel ?? ""; $("#fMat").value = c.mat ?? ""; $("#fRet").value = c.ret ?? ""; $("#formato").hidden = false; pintarFormato(); }
function pintarFormato(){
  const {p, ant, act} = S._val, pie = S.datos.pie, gg = pie.gg||0, ut = pie.ut||0, igv = pie.igv||0;
  const adel = (parseFloat($("#fAdel").value)||0)/100, mat = parseFloat($("#fMat").value)||0, ret = (parseFloat($("#fRet").value)||0)/100;
  guardarLS({adel:$("#fAdel").value, mat:$("#fMat").value, ret:$("#fRet").value});
  const filas = [...Object.entries(S.datos.capitulos).map(([it, d]) => ({it, d, cap:true})), ...S.partidas.map(x => ({it:x.item, x}))].sort((a,b) => a.it.localeCompare(b.it, "es", {numeric:true}));
  const tot = it => { const t = {pre:0, ant:0, act:0}; S.partidas.forEach(x => { if(x.item.startsWith(it + ".")){ t.pre += x.metrado*x.pu; t.ant += (ant[x.item]||0)*x.pu; t.act += (act[x.item]||0)*x.pu; } }); return t; };
  let cuerpo = "", T = {pre:0, ant:0, act:0};
  filas.forEach(f => {
    if(f.cap){ const t = tot(f.it); if(!t.pre) return; const ac = t.ant + t.act;
      cuerpo += `<tr class="t"><td>${f.it}</td><td>${esc(f.d)}</td><td></td><td></td><td></td><td class="n">${nf(t.pre)}</td><td></td><td class="n">${nf(t.ant)}</td><td></td><td class="n">${nf(t.act)}</td><td></td><td class="n">${nf(ac)}</td><td class="n">${nf(t.pre?ac/t.pre*100:0,2)}%</td><td></td><td class="n">${nf(t.pre-ac)}</td></tr>`; return; }
    const x = f.x, a = ant[x.item]||0, m = act[x.item]||0, ac = a + m, pre = x.metrado*x.pu;
    T.pre += pre; T.ant += a*x.pu; T.act += m*x.pu;
    cuerpo += `<tr><td>${x.item}</td><td>${esc(x.desc)}${ac > x.metrado + 1e-6 ? ' <b style="color:#b91c1c">(mayor metrado)</b>' : ""}</td><td>${esc(x.und)}</td><td class="n">${nf(x.metrado)}</td><td class="n">${nf(x.pu)}</td><td class="n">${nf(pre)}</td>
      <td class="n">${nf(a)}</td><td class="n">${nf(a*x.pu)}</td><td class="n">${nf(m)}</td><td class="n">${nf(m*x.pu)}</td><td class="n">${nf(ac)}</td><td class="n">${nf(ac*x.pu)}</td><td class="n">${nf(x.metrado?ac/x.metrado*100:0,2)}%</td><td class="n">${nf(x.metrado-ac)}</td><td class="n">${nf(pre-ac*x.pu)}</td></tr>`; });
  const T_ac = T.ant + T.act, linea = (lbl, f, cls="tot") => `<tr class="${cls}"><td></td><td>${lbl}</td><td colspan="3"></td><td class="n">${nf(f(T.pre))}</td><td></td><td class="n">${nf(f(T.ant))}</td><td></td><td class="n">${nf(f(T.act))}</td><td></td><td class="n">${nf(f(T_ac))}</td><td class="n">${nf(T.pre?f(T_ac)/f(T.pre)*100:0,2)}%</td><td></td><td class="n">${nf(f(T.pre)-f(T_ac))}</td></tr>`;
  const sub = v => v*(1+gg+ut), tot1 = v => sub(v)*(1+igv);
  const bruta = tot1(T.act), aAdel = bruta*adel, aRet = bruta*ret, neto = bruta - aAdel - mat - aRet;
  const per = CRONO?.periodos.find(x => x.n === p.n), pvAc = per ? per.pv_acum : pvA(p.hasta), pvMes = per ? per.pv_mes : null;
  $("#fHoja").innerHTML = `<div class="hoja"><h1>VALORIZACIÓN DE OBRA N° ${String(p.n).padStart(2,"0")}</h1><div class="sub">Periodo del ${fmtD(p.desde)} al ${fmtD(p.hasta)}</div>
    <div class="cab"><div><b>Obra:</b> ${esc(S.datos.modelo)} · casco estructural</div><div><b>Moneda:</b> soles (S/), precios sin IGV</div>
      <div><b>Inicio de obra:</b> ${fmtD(S.datos.inicio)}</div><div><b>Fecha de emisión:</b> ${fmtD(hoy())}</div>
      <div><b>Fuente de metrados:</b> metrado diario registrado en Revit (VZ_Registro)</div><div><b>Presupuesto:</b> S10 v2 (costo directo S/ ${nf(T.pre)})</div></div>

      <tr><th>Metrado</th><th>P.U. S/</th><th>Parcial S/</th><th>Metrado</th><th>S/</th><th>Metrado</th><th>S/</th><th>Metrado</th><th>S/</th><th>%</th><th>Metrado</th><th>S/</th></tr></thead>
    <tbody>${cuerpo}${linea("COSTO DIRECTO", v => v)}${linea(`GASTOS GENERALES (${nf(gg*100,2)}% del CD)`, v => v*gg, "")}${linea(`UTILIDAD (${nf(ut*100,2)}% del CD)`, v => v*ut, "")}
      ${linea("SUBTOTAL", sub)}${linea(`IGV (${nf(igv*100,2)}%)`, v => sub(v)*igv, "")}${linea("TOTAL VALORIZADO", tot1)}</tbody></table>
    <div class="res"><div>Avance económico del mes<b>${nf(T.pre?T.act/T.pre*100:0,2)}%</b>del costo directo contratado</div>
      <div>Avance económico acumulado<b>${nf(T.pre?T_ac/T.pre*100:0,2)}%</b>S/ ${nf(T_ac)} de ${nf(T.pre)}</div>
      <div>Programado acumulado al ${fmtD(p.hasta)}<b>${nf(T.pre?pvAc/T.pre*100:0,2)}%</b>S/ ${nf(pvAc)}${pvMes!=null?` · del mes S/ ${nf(pvMes)}`:""}</div>
      <div>Índice de desempeño del cronograma (SPI)<b>${pvAc ? nf(T_ac/pvAc,3) : "-"}</b>${pvAc ? (T_ac >= pvAc ? "adelantado o a tiempo" : "atrasado respecto al programa") : "sin programado"}</div></div>
    <table style="max-width:620px;margin-left:auto"><tbody>
      <tr><td>Costo directo del mes</td><td class="n">${nf(T.act)}</td><td class="n">100.00%</td></tr>

      <tr><td>Utilidad (costo indirecto)</td><td class="n">${nf(T.act*ut)}</td><td class="n">${nf(ut*100,2)}%</td></tr>
      <tr class="tot"><td>Subtotal</td><td class="n">${nf(sub(T.act))}</td><td class="n">${nf((1+gg+ut)*100,2)}%</td></tr>
      <tr><td>IGV</td><td class="n">${nf(sub(T.act)*igv)}</td><td class="n">${nf(igv*100,2)}% del subtotal</td></tr>
      <tr class="tot"><td>Valorización bruta del mes</td><td class="n">${nf(bruta)}</td><td></td></tr>
      <tr><td>(-) Amortización de adelanto directo</td><td class="n">${nf(-aAdel)}</td><td class="n">${nf(adel*100,2)}%</td></tr>
      <tr><td>(-) Amortización de adelanto de materiales</td><td class="n">${nf(-mat)}</td><td></td></tr>
      <tr><td>(-) Retención por fondo de garantía</td><td class="n">${nf(-aRet)}</td><td class="n">${nf(ret*100,2)}%</td></tr>
      <tr class="neto"><td>NETO A PAGAR</td><td class="n">${nf(neto)}</td><td></td></tr></tbody></table>
    <div class="nota2">Gastos generales, utilidad e IGV tomados del presupuesto S10 v2. Amortizaciones y retención: los escribe el usuario (por defecto 0). El programado viene del cronograma (calendario lunes a sábado). Metrados mayores al contrato se marcan como «mayor metrado».</div>
    <div class="firmas"><div>Residente de obra</div><div>Supervisión</div><div>Propietario</div></div></div>`;

$("#verFormato").addEventListener("click", () => { if(S._val) abrirFormato(); });

["#fAdel","#fMat","#fRet"].forEach(s => $(s).addEventListener("input", pintarFormato));

/* ============================================================ visor 3D (WebGL) */
const V = (() => {
  const cv = $("#cv"); const gl = cv.getContext("webgl", {antialias:true, preserveDrawingBuffer:false});
  if(!gl){ $("#info3d").textContent = "Este navegador no tiene WebGL."; return {colorear(){}, encuadrar(){}, resaltar(){}}; }
  const vs = `attribute vec3 p; attribute vec3 n; uniform mat4 mvp; uniform vec3 luz; varying float l;
    void main(){ gl_Position = mvp * vec4(p,1.0); l = 0.45 + 0.55*abs(dot(normalize(n), luz)); }`;
  const fs = `precision mediump float; uniform vec4 col; uniform float plano; varying float l; void main(){ gl_FragColor = plano > 0.5 ? col : vec4(col.rgb*l, col.a); }`;
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); return x; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
  const U = n => gl.getUniformLocation(pr, n), aP = gl.getAttribLocation(pr, "p"), aN = gl.getAttribLocation(pr, "n");
  let rangos = [], centro = [0,0,0], radio = 30, cam = {th:-0.8, ph:0.55, d:60, t:[0,0,0]}, colores = {}, resaltado = null;
  let fb = null, fbTex = null, fbW = 0, fbH = 0;

  function cargar(geo){
    let tot = 0; geo.elementos.forEach(e => tot += e.v.length);
    const P = new Float32Array(tot), N = new Float32Array(tot); let o = 0; rangos = [];
    let mn = [1e9,1e9,1e9], mx = [-1e9,-1e9,-1e9];
    geo.elementos.forEach(e => { const v = e.v, ini = o / 3;
      for(let i = 0; i < v.length; i += 9){
        const ax=v[i+3]-v[i], ay=v[i+4]-v[i+1], az=v[i+5]-v[i+2], bx=v[i+6]-v[i], by=v[i+7]-v[i+1], bz=v[i+8]-v[i+2];
        let nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx; const L = Math.hypot(nx,ny,nz)||1; nx/=L; ny/=L; nz/=L;
        for(let k = 0; k < 9; k += 3){ P[o]=v[i+k]; P[o+1]=v[i+k+1]; P[o+2]=v[i+k+2]; N[o]=nx; N[o+1]=ny; N[o+2]=nz;
          for(let c = 0; c < 3; c++){ mn[c] = Math.min(mn[c], P[o+c]); mx[c] = Math.max(mx[c], P[o+c]); } o += 3; } }
      rangos.push({id:e.id, ini, n:o/3 - ini, idc:[((rangos.length+1)&255)/255, (((rangos.length+1)>>8)&255)/255, (((rangos.length+1)>>16)&255)/255]}); });
    const bP = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bP); gl.bufferData(gl.ARRAY_BUFFER, P, gl.STATIC_DRAW); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 3, gl.FLOAT, false, 0, 0);
    const bN = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bN); gl.bufferData(gl.ARRAY_BUFFER, N, gl.STATIC_DRAW); gl.enableVertexAttribArray(aN); gl.vertexAttribPointer(aN, 3, gl.FLOAT, false, 0, 0);
    centro = mn.map((a,i) => (a + mx[i]) / 2); radio = Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) / 2;
    cam.t = centro.slice(); cam.d = radio * 2.6; colorear();
  }
  /* matrices */
  function persp(f, a, n, l){ const t = 1/Math.tan(f/2); return [t/a,0,0,0, 0,t,0,0, 0,0,(l+n)/(n-l),-1, 0,0,2*l*n/(n-l),0]; }
  function mul(a, b){ const r = new Array(16); for(let i=0;i<4;i++) for(let j=0;j<4;j++){ let s=0; for(let k=0;k<4;k++) s += a[k*4+j]*b[i*4+k]; r[i*4+j]=s; } return r; }
  function mira(e, t){ const up=[0,0,1]; let z=[e[0]-t[0],e[1]-t[1],e[2]-t[2]]; let L=Math.hypot(...z); z=z.map(x=>x/L);
    let x=[up[1]*z[2]-up[2]*z[1], up[2]*z[0]-up[0]*z[2], up[0]*z[1]-up[1]*z[0]]; L=Math.hypot(...x)||1; x=x.map(v=>v/L);
    const y=[z[1]*x[2]-z[2]*x[1], z[2]*x[0]-z[0]*x[2], z[0]*x[1]-z[1]*x[0]];
    return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0, -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1]; }
  function ojo(){ return [cam.t[0] + cam.d*Math.cos(cam.ph)*Math.cos(cam.th), cam.t[1] + cam.d*Math.cos(cam.ph)*Math.sin(cam.th), cam.t[2] + cam.d*Math.sin(cam.ph)]; }

  function colorear(){
    colores = {}; const modo = $("#modo").value, sp = S.selPartida;
    S.els.forEach(e => {
      let c;
      if(modo === "sector") c = e.sector === "A" ? [0.15,0.39,0.92] : [0.90,0.72,0.41];
      else { const pr = e.partidas.find(x => x.clase === "concreto" || x.clase === "muro"), ex = pr ? (e.ejec[pr.item]||0) : 0, alguno = Object.values(e.ejec).some(q => q > 1e-9);
        c = pr && ex >= pr.metrado*0.999 ? [0.09,0.64,0.29] : alguno ? [0.96,0.62,0.04] : [0.62,0.66,0.72]; }
      let a = 1;
      if(S.tl){ const st = estadoProg(e.id, S.tl);
        colores[e.id] = st === 2 ? [0.09,0.64,0.29,1] : st === 1 ? [0.96,0.62,0.04,1] : [0.55,0.6,0.7,0.06]; return; }
      if(S.selAct){ const en = (CRONO?.elementos[e.id] || []).includes(S.selAct);
        colores[e.id] = en ? [0.90,0.72,0.41,1] : [0.55,0.6,0.7,0.07]; return; }
      if(sp){ const pc = e.partidas.find(x => x.item === sp);
        if(pc){ const ex = e.ejec[sp]||0; c = ex > pc.metrado*1.000001 ? [0.86,0.15,0.15] : ex >= pc.metrado*0.999 ? [0.09,0.64,0.29] : ex > 1e-9 ? [0.96,0.62,0.04] : [0.90,0.72,0.41]; }
        else { c = [0.55,0.6,0.7]; a = 0.07; } }
      if(S.selEl && e.id !== S.selEl && !sp){ a = Math.min(a, 0.12); }
      if(e.id === resaltado || e.id === S.selEl){ c = [0.15,0.39,0.92]; a = 1; }
      colores[e.id] = [c[0], c[1], c[2], a];
    });
    leyenda(); dibujar();
  }
  function leyenda(){ const it = (c, t) => `<span><i style="background:${c}"></i>${t}</span>`;
    if(S.tl){ $("#leyenda").innerHTML = it("#16A34A","Vaciado según programa") + it("#F59E0B","En ejecución programada") + it("rgba(140,153,178,.35)","Aún no programado"); return; }
    if(S.selAct){ $("#leyenda").innerHTML = it("#E5B869","Elementos de la actividad " + esc(S.selAct)) + it("rgba(140,153,178,.35)","Otros"); return; }
    $("#leyenda").innerHTML = $("#modo").value === "sector" ? it("#2563EB","Sector A") + it("#E5B869","Sector B")
      : S.selPartida ? it("#E5B869","Sin ejecutar") + it("#F59E0B","Parcial") + it("#16A34A","Completo") + it("#DC2626","Mayor metrado") + it("rgba(140,153,178,.35)","Otros (transparentes)")
      : it("#9EA8B8","Sin avance") + it("#F59E0B","En ejecución") + it("#16A34A","Vaciado"); }

  function dibujar(pick){
    const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
    if(cv.width !== w*dpr || cv.height !== h*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
    gl.viewport(0, 0, cv.width, cv.height);
    const e = ojo(), mvp = mul(persp(0.8, cv.width/Math.max(1,cv.height), Math.max(0.05, cam.d - radio*3), cam.d + radio*3), mira(e, cam.t));
    gl.uniformMatrix4fv(U("mvp"), false, mvp);
    const lz = [e[0]-cam.t[0]+radio, e[1]-cam.t[1]-radio, e[2]-cam.t[2]+radio*2], L = Math.hypot(...lz); gl.uniform3f(U("luz"), lz[0]/L, lz[1]/L, lz[2]/L);
    gl.uniform1f(U("plano"), pick ? 1 : 0);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); gl.enable(gl.DEPTH_TEST);
    const vis = r => { const el = S.porId[r.id]; return el && visible(el); };
    gl.disable(gl.BLEND); gl.depthMask(true);
    rangos.forEach(r => { if(!vis(r)) return; const c = colores[r.id] || [0.6,0.6,0.6,1]; if(!pick && c[3] < 1) return;
      gl.uniform4f(U("col"), ...(pick ? [...r.idc, 1] : c)); gl.drawArrays(gl.TRIANGLES, r.ini, r.n); });
    if(pick) return;
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); gl.depthMask(false);
    rangos.forEach(r => { if(!vis(r)) return; const c = colores[r.id]; if(!c || c[3] >= 1) return; gl.uniform4f(U("col"), ...c); gl.drawArrays(gl.TRIANGLES, r.ini, r.n); });
    gl.depthMask(true);
  }
  function elegir(x, y){
    const dpr = cv.width / cv.clientWidth;
    if(!fb || fbW !== cv.width || fbH !== cv.height){ fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      fbTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, fbTex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cv.width, cv.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbTex, 0);
      const rb = gl.createRenderbuffer(); gl.bindRenderbuffer(gl.RENDERBUFFER, rb); gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, cv.width, cv.height);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb); fbW = cv.width; fbH = cv.height; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb); dibujar(true);
    const px = new Uint8Array(4); gl.readPixels(Math.round(x*dpr), Math.round(cv.height - y*dpr), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); dibujar();
    const k = px[0] + (px[1] << 8) + (px[2] << 16); return k ? rangos[k-1]?.id : null;
  }
  /* interacción */
  let arr = null;
  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("pointerdown", e => { arr = {x:e.clientX, y:e.clientY, b:e.button, sh:e.shiftKey, mov:0}; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if(!arr) return; const dx = e.clientX - arr.x, dy = e.clientY - arr.y; arr.x = e.clientX; arr.y = e.clientY; arr.mov += Math.abs(dx) + Math.abs(dy);

      const der = [-st, ct, 0], arriba = [-sp*ct, -sp*st, cp];   // ejes de pantalla
      for(let i = 0; i < 3; i++) cam.t[i] += (-der[i]*dx + arriba[i]*dy) * s; }
    else { cam.th -= dx * 0.008; cam.ph = Math.max(-1.5, Math.min(1.5, cam.ph + dy * 0.008)); }

  cv.addEventListener("pointerup", e => { if(arr && arr.mov < 4 && arr.b === 0){ const r = cv.getBoundingClientRect(), id = elegir(e.clientX - r.left, e.clientY - r.top);
      S.selEl = id || null; if(id){ S.selPartida = null; S.selAct = null; } pintarLista(); pintarDetalle(); colorear();
      if(id){ const el = S.porId[id]; $("#info3d").textContent = `${el.tipo} · ${el.nivel} · ${el.paquete}-${el.sector} · ElementId ${id}`; } }
    arr = null; });
  cv.addEventListener("wheel", e => { e.preventDefault(); cam.d = Math.max(radio*0.05, Math.min(radio*8, cam.d * (e.deltaY > 0 ? 1.12 : 0.89))); dibujar(); }, {passive:false});
  addEventListener("resize", () => dibujar());
  function encuadrar(lista){
    const ids = new Set((lista && lista.length ? lista : S.els).filter(visible).map(e => e.id)); let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
    const g = S.geo; if(!g) return;
    g.elementos.forEach(e => { if(!ids.has(e.id)) return; for(let i = 0; i < e.v.length; i += 3) for(let c = 0; c < 3; c++){ mn[c] = Math.min(mn[c], e.v[i+c]); mx[c] = Math.max(mx[c], e.v[i+c]); } });
    if(mn[0] > mx[0]) return; cam.t = mn.map((a,i) => (a+mx[i])/2); cam.d = Math.max(4, Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) * 1.4); dibujar();
  }
  function resaltar(id){ resaltado = id; colorear(); }
  return {cargar, colorear, dibujar, encuadrar, resaltar};
})();

$("#encuadre").addEventListener("click", () => V.encuadrar(S.selPartida ? S.elsDePartida[S.selPartida] : null));
